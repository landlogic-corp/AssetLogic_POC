# Static site: no build step. Netlify serves index.html from the repository root.
[build]
  publish = "."
  command = "node scripts/build-index.js"

[build.environment]
  NODE_VERSION = "22"

# Prototype with example data: keep it out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Serverless functions (database access lives here, never in the page)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "@google-cloud/cloud-sql-connector"]
  included_files = ["scripts/db.js"]
